[package]
name = "cairn"
version = "0.10.4"
edition = "2024"
license = "AGPL-3.0-or-later"
authors = ["Justus Zorn"]

[dependencies]
anyhow = "1.0.102"
base64 = "0.23"
clap = { version = "4.6.1", features = ["derive", "env"] }
crc32fast = "1"
deadpool-postgres = "0.14.1"
hmac = "0.13"
http-body-util = "0.1.3"
md-5 = "0.11"
hyper = { version = "1.10.1", features = ["full"] }
hyper-util = { version = "0.1.20", features = ["full"] }
libc = "0.2"
percent-encoding = "2.3.2"
roxmltree = "0.21"
serde_json = "1"
sha2 = "0.11"
tokio = { version = "1.52.3", features = ["full"] }
tokio-postgres = { version = "0.7.17", features = ["with-uuid-1"] }
tokio-util = "0.7.18"
uuid = { version = "1.23.3", features = ["v4", "v7", "serde"] }
getrandom = { version = "0.4", features = ["sys_rng"] }
crc32c = "0.6.8"
crc64fast-nvme = "1.2.1"
twox-hash = { version = "2.1.5", default-features = false, features = ["std", "xxhash64", "xxhash3_64", "xxhash3_128"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
serde = { version = "1", features = ["derive"] }
utoipa = "6"
utoipa-axum = "0.3"
sha1 = "0.11"
chacha20poly1305 = { version = "0.11.0", features = ["zeroize"] }
bytes = "1.11"
zeroize = "1.9"
hyper-rustls = { version = "0.27.10", default-features = false, features = ["http1", "ring", "tls12"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1.0.11"
ring = "0.17"
multer = { version = "3.1", default-features = false }
futures-core = "0.3.34"
futures-util = { version = "0.3.32", default-features = false, features = ["sink", "std"] }
reed-solomon-simd = "3.1"
tower = { version = "0.5", features = ["util"] }
# Inventory reports are gzipped CSV (see `inventory`); the pure-Rust backend.
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
# SNS's message signatures (see `notifications::signing`): RSA keys made and
# used with SHA1 (SignatureVersion 1, SNS's default), which ring can't do;
# and their certificates, self-signed through ring.
rsa = { version = "0.10", features = ["sha1", "pkcs1v15"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
# Parquet inventory reports (see `inventory::parquet`), and reading them as
# Batch Operations manifests (`batch::parquet`): its low-level API; Snappy,
# as S3 writes them, and gzip, which other writers use. And Iceberg tables'
# data files (see `tables::compaction`), through Arrow: zstd (Iceberg's
# default) and LZ4 too.
parquet = { version = "58.4", default-features = false, features = ["snap", "flate2-rust_backened", "zstd", "lz4", "arrow"] }
# Apache Iceberg (see `tables::iceberg`): tables' metadata, manifests, and
# reading and writing their data, for S3 Tables' catalog and maintenance.
# It pins Arrow and Parquet (58), which `parquet` above follows.
iceberg = "0.11"
# What implementing its storage (`iceberg::io::Storage`) takes.
async-trait = "0.1"
typetag = "0.2"
# Arrow (the versions `iceberg` uses), for compaction's ordering of rows
# (see `tables::compaction`).
arrow-array = "58.4"
arrow-cast = "58.4"
arrow-schema = "58.4"
arrow-select = "58.4"
arrow-row = "58.4"

[dev-dependencies]
# The mock OIDC issuer's HTTPS (`oidc::mock`); hyper-rustls's already.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }

# The erasure code's arithmetic is slow unoptimized, which tests of coded
# blobs feel.
[profile.dev.package.reed-solomon-simd]
opt-level = 3
